# Baut den ImmoAdv Browser für Windows und Mac – automatisch bei jedem Push auf „main“ –
# und veröffentlicht neue Versionen als GitHub-Release. Die installierten Programme aktualisieren sich daraus selbst.
# Benötigt in CircleCI → Project Settings → Environment Variables: GH_TOKEN (GitHub-Token mit Schreibrecht auf Feray20/immoadv-browser-desktop).
# Neue Version = in package.json "version" erhöhen (z. B. 1.0.1). Gleiche Versionsnummer wird nicht erneut veröffentlicht.
version: 2.1

orbs:
  win: circleci/windows@5.1

jobs:
  windows:
    executor: win/default
    steps:
      - checkout
      - run: node --version
      - run:
          name: Abhängigkeiten
          shell: bash.exe
          command: set -o pipefail; npm install --no-audit --no-fund 2>&1 | tee -a build.log
      - run:
          name: Tests
          shell: bash.exe
          command: set -o pipefail; npm test 2>&1 | tee -a build.log
      - run:
          name: Windows-Installer und Store-Paket bauen
          shell: bash.exe
          command: set -o pipefail; npm run dist:win 2>&1 | tee -a build.log
          environment:
            CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run:
          name: Fehlerprotokoll an GitHub melden
          when: on_fail
          shell: bash.exe
          command: |
            [ -z "$GH_TOKEN" ] && { echo "GH_TOKEN fehlt"; exit 0; }
            API="https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME"
            { echo '**CircleCI-Fehler (Windows) – letzte Zeilen:**'; echo '```'; tail -120 build.log 2>/dev/null; echo '```'; } > comment.md
            node -e 'console.log(JSON.stringify({body:require("fs").readFileSync("comment.md","utf8").slice(-60000)}))' > body.json
            CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/commits/$CIRCLE_SHA1/comments" -d @body.json)
            LAST=$(grep -iE "error|fehler|failed" build.log 2>/dev/null | tail -1 | tr -d '"\' | cut -c1-110)
            node -e 'console.log(JSON.stringify({state:"error",context:"fehlerbericht/Windows",description:(process.argv[1]+" "+process.argv[2]).slice(0,139)}))' "Kommentar:$CODE" "$LAST" > st.json
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/statuses/$CIRCLE_SHA1" -d @st.json
            echo "Kommentar-Antwort: $CODE"; head -c 300 resp.txt
      - store_artifacts:
          path: dist
          destination: windows

  mac:
    macos:
      xcode: "16.4.0"
    resource_class: m4pro.medium
    steps:
      - checkout
      - run: brew install gnupg node@22 && echo 'export PATH="$(brew --prefix node@22)/bin:$PATH"' >> "$BASH_ENV"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run:
          name: Mac-App (.dmg) bauen, signieren und beglaubigen
          # benötigt in CircleCI → Project Settings → Environment Variables:
          # CSC_LINK (Developer-ID-Zertifikat als Base64), CSC_KEY_PASSWORD,
          # APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
          command: |
            if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi   # ohne Zertifikat: unsigniert bauen
            set -o pipefail; npm run dist:mac 2>&1 | tee -a build.log
      - run:
          name: Fehlerprotokoll an GitHub melden
          when: on_fail
          command: |
            [ -z "$GH_TOKEN" ] && { echo "GH_TOKEN fehlt"; exit 0; }
            API="https://api.github.com/repos/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME"
            { echo '**CircleCI-Fehler (Mac) – letzte Zeilen:**'; echo '```'; tail -120 build.log 2>/dev/null; echo '```'; } > comment.md
            node -e 'console.log(JSON.stringify({body:require("fs").readFileSync("comment.md","utf8").slice(-60000)}))' > body.json
            CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/commits/$CIRCLE_SHA1/comments" -d @body.json)
            LAST=$(grep -iE "error|fehler|failed" build.log 2>/dev/null | tail -1 | tr -d '"\' | cut -c1-110)
            node -e 'console.log(JSON.stringify({state:"error",context:"fehlerbericht/Mac",description:(process.argv[1]+" "+process.argv[2]).slice(0,139)}))' "Kommentar:$CODE" "$LAST" > st.json
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/statuses/$CIRCLE_SHA1" -d @st.json
            echo "Kommentar-Antwort: $CODE"; head -c 300 resp.txt
      - store_artifacts:
          path: dist
          destination: mac

workflows:
  build:
    jobs:
      - windows:
          filters: { branches: { only: main } }
      - mac:
          requires: [windows]          # nacheinander, damit beide Dateien im selben Release landen
          filters: { branches: { only: main } }
