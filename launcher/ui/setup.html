<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>ImmoAdv Browser</title>
  <style>
    :root { --fade: linear-gradient(120deg, #2A5BD7 0%, #3a6cf0 45%, #19C2B0 100%); }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; font: 13px/1.5 "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif; color: #eef3fb; background: #0f2240; -webkit-app-region: drag; overflow: hidden; }
    body::before { content: ""; position: fixed; inset: 0; background: radial-gradient(700px 400px at 10% -10%, rgba(42,91,215,.35), transparent 60%), radial-gradient(600px 400px at 100% 0%, rgba(25,194,176,.18), transparent 60%); }
    main { position: relative; width: 420px; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 22px; margin: 16px 0 6px; font-weight: 650; }
    p { color: #a7b4c8; margin: 0 0 18px; }
    .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
    .bar i { display: block; height: 100%; width: 3%; background: var(--fade); border-radius: 99px; transition: width .3s cubic-bezier(.2,.8,.2,1); }
    #step { margin-top: 10px; color: #6f7f97; font-size: 12px; min-height: 18px; }
    button { -webkit-app-region: no-drag; margin-top: 16px; height: 36px; padding: 0 18px; border-radius: 12px; border: 0; background: var(--fade); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="" id="logo">
    <h1>ImmoAdv Browser wird eingerichtet</h1>
    <p>Einmalig: Der neue Motor (Firefox von Mozilla) wird geladen, geprüft und eingerichtet. Danach funktioniert die Google-Anmeldung direkt im Browser. Deine Lesezeichen, Passwörter und Einstellungen bleiben erhalten.</p>
    <div class="bar"><i id="bar"></i></div>
    <div id="step">Startet …</div>
    <button id="retry" class="hidden">Noch einmal versuchen</button>
  </main>
  <script src="setup.js"></script>
</body>
</html>
