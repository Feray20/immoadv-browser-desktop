# ImmoAdv Browser bauen – über Azure Pipelines auf Ferays eigenen Rechnern (Wunsch Feray 01.11.2026: Repo privat,
# 0 €, unbegrenzt). Azure steuert, PC/Mac führen aus (Agent-Pool „ImmoAdv“). Ist ein Rechner aus, wartet der Build.
# Baut bei jedem Push auf main. Neue Version = "version" in package.json erhöhen; gleiche Nummer wird nicht erneut
# veröffentlicht. Updates gehen privat nach immoadv.de (/api/browser/update), nicht mehr zu GitHub.
# Kein Geheimnis im Build: der Server fragt mit dem Kurzzeit-Zugang des Jobs bei Azure nach, ob der Build läuft.
trigger:
  branches:
    include: [main]
pr: none

variables:
  # Mac an (Feray 02.11.2026: „beide Software für Mac ready“). Läuft auf dem MacBook-Agent im Pool „ImmoAdv“;
  # ist der Mac aus oder der Agent nicht eingerichtet, wartet nur dieser Teil – Windows baut unabhängig weiter.
  MAC_BAUEN: 'true'

stages:
  - stage: windows
    displayName: Windows
    dependsOn: []
    jobs:
      - job: windows
        displayName: Browser für Windows
        timeoutInMinutes: 90
        pool:
          name: ImmoAdv
          demands: [Agent.OS -equals Windows_NT]
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - task: NodeTool@0
            inputs: { versionSpec: '22.x' }
          - script: '"%ProgramFiles%\Git\bin\bash.exe" scripts/azure-build.sh windows'
            displayName: Bauen, Store-Paket, Veröffentlichen
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - publish: feed
            artifact: feed-windows
            displayName: Versionsangabe Windows bereitlegen
            condition: succeeded()
          - publish: store
            artifact: microsoft-store-paket
            displayName: Store-Paket bereitlegen
            condition: succeeded()

  - stage: mac
    displayName: Mac
    dependsOn: []
    condition: eq(variables['MAC_BAUEN'], 'true')
    jobs:
      - job: mac
        displayName: Browser für Mac
        timeoutInMinutes: 90
        pool:
          name: ImmoAdv
          demands: [Agent.OS -equals Darwin]
        steps:
          - checkout: self
            fetchDepth: 1
            clean: true
          - task: NodeTool@0
            inputs: { versionSpec: '22.x' }
          - bash: bash scripts/azure-build.sh mac
            displayName: Bauen und Veröffentlichen
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          - publish: feed
            artifact: feed-mac
            displayName: Versionsangabe Mac bereitlegen
            condition: succeeded()

  # Gemeinsame Freigabe (03.11.2026): erst wenn Windows UND Mac gebaut sind, sehen die installierten Browser die neue
  # Version – so laufen beide Geräte immer auf demselben Stand.
  - stage: freigabe
    displayName: Freigabe Windows + Mac
    dependsOn: [windows, mac]
    condition: succeeded()
    jobs:
      - job: feed
        displayName: Update für beide Systeme freigeben
        pool:
          name: ImmoAdv
        steps:
          - checkout: self
            fetchDepth: 1
          - download: current
            patterns: 'feed-*/**'
          - task: NodeTool@0
            inputs: { versionSpec: '22.x' }
          - script: node scripts/publish-immoadv.mjs feed "$(Pipeline.Workspace)"
            displayName: Freigeben
            env:
              SYSTEM_ACCESSTOKEN: $(System.AccessToken)
