# ImmoAdv Browser – Build über Azure Pipelines (kostenlos für öffentliche Repos: Windows + Mac, unbegrenzte Minuten).
# Baut bei jedem Push auf „main“ erst Windows, dann Mac, und veröffentlicht die neue Version als GitHub-Release.
# Die installierten Programme holen sich das Update von dort (Knopf „Update jetzt installieren“).
#
# Einmalig in Azure DevOps → Pipelines → diese Pipeline → „Variables“ anlegen (alle als „geheim“ markieren):
#   GH_TOKEN                      GitHub-Token mit Schreibrecht auf Feray20/immoadv-browser-desktop  (Pflicht)
#
# Windows-Signierung mit Azure Artifact Signing (optional – fehlt etwas, wird unsigniert gebaut):
#   AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET   App-Registrierung mit Rolle „Artifact Signing Certificate Profile Signer“
#   ARTIFACT_SIGNING_ENDPOINT     z. B. https://weu.codesigning.azure.net/  (Region des Signing-Kontos)
#   ARTIFACT_SIGNING_ACCOUNT      Name des Artifact-Signing-Kontos
#   ARTIFACT_SIGNING_PROFILE      Name des Zertifikatprofils
#   ARTIFACT_SIGNING_PUBLISHER    Herausgebername exakt wie im Zertifikat (CN)
#
# Mac-Signierung/Beglaubigung (optional): CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# Neue Version = in package.json "version" erhöhen. Gleiche Versionsnummer wird nicht erneut veröffentlicht.

trigger:
  branches:
    include: [main]
pr: none

variables:
  NODE_VERSION: '22.x'

stages:
  - stage: windows
    displayName: Windows
    jobs:
      - job: windows
        displayName: Windows-Installer
        timeoutInMinutes: 120
        pool:
          vmImage: windows-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - bash: set -o pipefail; npm install --no-audit --no-fund 2>&1 | tee -a build.log
            displayName: Abhängigkeiten
          - bash: set -o pipefail; npm test 2>&1 | tee -a build.log
            displayName: Tests
          - bash: |
              set -eo pipefail
              # nicht angelegte Azure-Variablen kommen als Text "$(NAME)" an → als leer behandeln
              for v in GH_TOKEN AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE ARTIFACT_SIGNING_PUBLISHER CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                case "${!v}" in '$('*) unset "$v";; esac
              done
              ARGS=(--win --x64 --publish always)
              if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_SECRET" ] && [ -n "$ARTIFACT_SIGNING_ACCOUNT" ]; then
                echo "Signiere mit Azure Artifact Signing ($ARTIFACT_SIGNING_ACCOUNT / $ARTIFACT_SIGNING_PROFILE)"
                ARGS+=(
                  "-c.win.azureSignOptions.endpoint=$ARTIFACT_SIGNING_ENDPOINT"
                  "-c.win.azureSignOptions.codeSigningAccountName=$ARTIFACT_SIGNING_ACCOUNT"
                  "-c.win.azureSignOptions.certificateProfileName=$ARTIFACT_SIGNING_PROFILE"
                  "-c.win.azureSignOptions.publisherName=$ARTIFACT_SIGNING_PUBLISHER"
                )
              else
                echo "Keine Artifact-Signing-Daten hinterlegt – Windows-Installer wird unsigniert gebaut."
                export CSC_IDENTITY_AUTO_DISCOVERY=false
              fi
              {
                node scripts/fetch-vendor.mjs &&
                node scripts/build-rules.mjs &&
                node scripts/ensure-release.mjs &&
                npx electron-builder "${ARGS[@]}" &&
                node scripts/finalize-release.mjs
              } 2>&1 | tee -a build.log
            displayName: Windows-Installer bauen, signieren, veröffentlichen
            env:
              GH_TOKEN: $(GH_TOKEN)
              AZURE_TENANT_ID: $(AZURE_TENANT_ID)
              AZURE_CLIENT_ID: $(AZURE_CLIENT_ID)
              AZURE_CLIENT_SECRET: $(AZURE_CLIENT_SECRET)
              ARTIFACT_SIGNING_ENDPOINT: $(ARTIFACT_SIGNING_ENDPOINT)
              ARTIFACT_SIGNING_ACCOUNT: $(ARTIFACT_SIGNING_ACCOUNT)
              ARTIFACT_SIGNING_PROFILE: $(ARTIFACT_SIGNING_PROFILE)
              ARTIFACT_SIGNING_PUBLISHER: $(ARTIFACT_SIGNING_PUBLISHER)
          - template: build/azure-fehlerbericht.yml
            parameters: { plattform: Windows }
          - publish: dist
            artifact: windows
            condition: always()

  - stage: mac
    displayName: Mac
    dependsOn: windows          # nacheinander, damit beide Dateien im selben Release landen
    condition: succeeded()
    jobs:
      - job: mac
        displayName: Mac-App (.dmg)
        timeoutInMinutes: 120
        pool:
          vmImage: macOS-latest
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(NODE_VERSION)
          - bash: set -o pipefail; npm install --no-audit --no-fund 2>&1 | tee -a build.log
            displayName: Abhängigkeiten
          - bash: set -o pipefail; npm test 2>&1 | tee -a build.log
            displayName: Tests
          - bash: |
              # nicht angelegte Azure-Variablen kommen als Text "$(NAME)" an → als leer behandeln
              for v in GH_TOKEN AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET ARTIFACT_SIGNING_ENDPOINT ARTIFACT_SIGNING_ACCOUNT ARTIFACT_SIGNING_PROFILE ARTIFACT_SIGNING_PUBLISHER CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
                case "${!v}" in '$('*) unset "$v";; esac
              done
              # ohne Zertifikat: unsigniert bauen
              if [ -z "$CSC_LINK" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; unset CSC_LINK CSC_KEY_PASSWORD; fi
              [ -z "$APPLE_ID" ] && unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
              set -o pipefail; npm run dist:mac 2>&1 | tee -a build.log
            displayName: Mac-App bauen, signieren, veröffentlichen
            env:
              GH_TOKEN: $(GH_TOKEN)
              CSC_LINK: $(CSC_LINK)
              CSC_KEY_PASSWORD: $(CSC_KEY_PASSWORD)
              APPLE_ID: $(APPLE_ID)
              APPLE_APP_SPECIFIC_PASSWORD: $(APPLE_APP_SPECIFIC_PASSWORD)
              APPLE_TEAM_ID: $(APPLE_TEAM_ID)
          - template: build/azure-fehlerbericht.yml
            parameters: { plattform: Mac }
          - publish: dist
            artifact: mac
            condition: always()
