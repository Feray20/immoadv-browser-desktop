# Meldet bei einem fehlgeschlagenen Build die letzten Protokollzeilen als Kommentar am Commit auf GitHub.
parameters:
  - name: plattform
    type: string

steps:
  - bash: |
      case "$GH_TOKEN" in ''|'$('*) echo "GH_TOKEN fehlt"; exit 0;; esac
      API="https://api.github.com/repos/Feray20/immoadv-browser-desktop"
      { echo '**Azure-Pipelines-Fehler (${{ parameters.plattform }}) – letzte Zeilen:**'; echo '```'; tail -120 build.log 2>/dev/null; echo '```'; } > comment.md
      node -e 'console.log(JSON.stringify({body:require("fs").readFileSync("comment.md","utf8").slice(-60000)}))' > body.json
      CODE=$(curl -s -o resp.txt -w "%{http_code}" -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/commits/$BUILD_SOURCEVERSION/comments" -d @body.json)
      LAST=$(grep -iE "error|fehler|failed" build.log 2>/dev/null | tail -1 | tr -d '"\' | cut -c1-110)
      node -e 'console.log(JSON.stringify({state:"error",context:"fehlerbericht/${{ parameters.plattform }}",description:(process.argv[1]+" "+process.argv[2]).slice(0,139)}))' "Kommentar:$CODE" "$LAST" > st.json
      curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API/statuses/$BUILD_SOURCEVERSION" -d @st.json
      echo "Kommentar-Antwort: $CODE"; head -c 300 resp.txt
    displayName: Fehlerprotokoll an GitHub melden
    condition: failed()
    env:
      GH_TOKEN: $(GH_TOKEN)
