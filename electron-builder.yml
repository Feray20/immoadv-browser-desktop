appId: de.immoadv.browser.desktop
productName: ImmoAdv Browser
copyright: © ImmoAdv
directories:
  output: dist
  buildResources: build
files:
  - launcher/**/*
  - src/shared/lists.js
  - package.json
# Version 4: Firefox-Motor wird beim ersten Start offiziell von Mozilla geladen. Mit dabei: ImmoAdv-Erweiterung (inkl. Filterlisten,
# PDF-Texterkennung, Office-Betrachter), Oberfläche (userChrome), feste Einstellungen und Symbole je Dateityp.
extraResources:
  - from: vendor/extension/immoadv.xpi
    to: extension/immoadv.xpi
  - from: engine
    to: engine
  - from: launcher/relay.js
    to: relay.js
  # Symbole je Dateityp (PDF, Word, Excel …) – Dokumente zeigen ihr Format, nicht das Browser-Logo (01.11.2026)
  - from: build/dateisymbole
    to: dateisymbole
asarUnpack:
  - node_modules/7zip-bin/**/*
  - node_modules/rcedit/**/*
asar: true
# Als Webbrowser wählbar (Mac: „Standard-Webbrowser“, Windows: über build/installer.nsh)
protocols:
  - name: ImmoAdv Browser
    schemes: [immoadv-browser]
  - name: Webadresse
    schemes: [http, https]
    role: Viewer

# Updates: jede neue Version wird als GitHub-Release veröffentlicht; die Programme holen sie sich von dort.
publish:
  provider: github
  owner: Feray20
  repo: immoadv-browser-desktop
  releaseType: draft
releaseInfo:
  releaseNotesFile: NEUERUNGEN.md     # Text erscheint im Update-Pop-up
electronFuses:
  runAsNode: true            # nötig für die Native-Messaging-Weiterleitung (relay.js), siehe launcher/relay.js
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true

# ---------- Windows ----------
win:
  icon: build/icon-win.png
  target:
    - target: nsis            # Installer zum Herunterladen (z. B. über „ImmoAdv Programme“)
      arch: [x64]
    # Microsoft-Store-Paket: „appx“ hier ergänzen, sobald die Werte aus Partner Center eingetragen sind
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: ImmoAdv Browser
  createStartMenuShortcut: true
  artifactName: ImmoAdv-Browser-Setup-${version}.${ext}
  include: build/installer.nsh
appx:
  # Produktidentität aus Partner Center (App „ImmoAdv Browser“, Store-ID 9MWQZKWQ9J8H) – 01.11.2026
  identityName: FerayKorkmaz.ImmoAdvBrowser
  publisher: CN=48D30524-28E4-4D4B-B2FF-B368E72F1A66
  publisherDisplayName: Feray Korkmaz
  displayName: ImmoAdv Browser
  languages: [de-DE]
  backgroundColor: "#0B1F3A"

# ---------- Mac ----------
mac:
  icon: build/icon.png
  # Texte für die macOS-Abfrage von Kamera und Mikrofon (z. B. Google Meet, Teams) – ohne sie stürzt der Zugriff ab bzw. wird verweigert.
  extendInfo:
    # 03.11.2026 (Feray: „Browser steht 3× in Sofort beenden“, Dock-Problem): Starter und Hintergrund-Dienst sind
    # unsichtbare Hilfsprogramme – kein Dock-Symbol, kein Eintrag in „Sofort beenden“/Cmd+Tab. Sichtbar ist nur der Browser.
    LSUIElement: true
    NSCameraUsageDescription: Der ImmoAdv Browser braucht die Kamera für Videoanrufe auf Webseiten (z. B. Google Meet, Teams) – nur wenn du es auf der Seite erlaubst.
    NSMicrophoneUsageDescription: Der ImmoAdv Browser braucht das Mikrofon für Anrufe auf Webseiten (z. B. Google Meet, Teams) – nur wenn du es auf der Seite erlaubst.
  # 7-Zip wird nur unter Windows gebraucht (Firefox-Installer entpacken) – am Mac nicht mitliefern
  files:
    - launcher/**/*
    - src/shared/lists.js
    - package.json
    - "!node_modules/7zip-bin/**/*"
    - "!node_modules/rcedit/**/*"
  # nur am Mac über electron-builder (Windows: build/installer.nsh, ohne Standard ungefragt umzustellen)
  fileAssociations:
    # Symbole je Dateityp (04.11.2026, Feray: „hier kein ImmoAdv-Logo, sondern bei PDF das PDF-Symbol“) – vorher fehlte am Mac
    # das Symbol, macOS zeigte für jede Datei das Browser-Logo. Jetzt wie unter Windows: PDF-, Bild- und HTML-Symbol.
    - ext: [html, htm]
      name: HTML-Dokument
      role: Viewer
      icon: build/dateisymbole/html.icns
    - ext: pdf
      name: PDF-Dokument
      role: Viewer
      icon: build/dateisymbole/pdf.icns
    # Office-Dateien öffnet die ImmoAdv-Software (Wunsch Feray 03.11.2026: „Browser nur Bilder und PDFs mit Bearbeiten,
    # Office bei ImmoAdv“) – der Browser meldet sich dafür nicht mehr an.
    # Bilder (02.11.2026): öffnen per Doppelklick mit den Bild-Werkzeugen des Browsers – wie unter Windows
    - ext: png
      name: PNG-Bild
      role: Viewer
      icon: build/dateisymbole/png.icns
    - ext: [jpg, jpeg]
      name: JPEG-Bild
      role: Viewer
      icon: build/dateisymbole/jpg.icns
    - ext: gif
      name: GIF-Bild
      role: Viewer
      icon: build/dateisymbole/gif.icns
    - ext: webp
      name: WebP-Bild
      role: Viewer
      icon: build/dateisymbole/webp.icns
    - ext: bmp
      name: BMP-Bild
      role: Viewer
      icon: build/dateisymbole/bmp.icns
  category: public.app-category.productivity
  # Nur Apple-Chip (02.11.2026): Die „universal“-Fassung (Apple-Chip + Intel zusammengefügt) zerstörte ohne
  # Neusignierung die Code-Signatur des Electron-Frameworks – macOS beendete den Browser sofort beim Start
  # („Code Signature Invalid“, Absturzbericht 4.0.1). Ferays MacBook hat einen Apple-Chip.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip               # wird für automatische Updates am Mac gebraucht
      arch: [arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # feste Namen, damit sich das Programm Updates selbst holen kann
  artifactName: ImmoAdv-Browser-${version}-${arch}-mac.${ext}
dmg:
  artifactName: ImmoAdv-Browser-${version}.${ext}
  title: ImmoAdv Browser
