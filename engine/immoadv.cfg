// ImmoAdv Browser – feste Einstellungen des Firefox-Motors (erste Zeile muss ein Kommentar sein)
// Die ImmoAdv-Erweiterung gehört zum Programm selbst und liegt im eigenen Programmordner – sie braucht keine Mozilla-Signatur.
// (Geht nur mit Firefox ESR; andere Erweiterungen aus dem Mozilla-Katalog bleiben wie gewohnt signiert.)
lockPref("xpinstall.signatures.required", false);
lockPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("extensions.pocket.enabled", false);
lockPref("browser.tabs.firefox-view", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);

// ---------- ImmoAdv statt Firefox im Fenstertitel und in der Taskleiste ----------
// (nur Anzeige; der Motor bleibt unverändert Firefox ESR von Mozilla)
(function () {
  var Cc = Components.classes, Ci = Components.interfaces;
  var log = function (m) { try { dump('[ImmoAdv cfg] ' + m + '\n'); } catch (e) {} };
  var Services = (typeof globalThis !== 'undefined' && globalThis.Services) || {
    obs: Cc['@mozilla.org/observer-service;1'].getService(Ci.nsIObserverService),
    scriptSecurityManager: Cc['@mozilla.org/scriptsecuritymanager;1'].getService(Ci.nsIScriptSecurityManager),
    io: Cc['@mozilla.org/network/io-service;1'].getService(Ci.nsIIOService),
    startup: Cc['@mozilla.org/toolkit/app-startup;1'].getService(Ci.nsIAppStartup)
  };
  try {
    var BRAND = 'ImmoAdv Browser';
    function apply(win) {
      try {
        var root = win.document && win.document.documentElement;
        if (!root || root.getAttribute('windowtype') !== 'navigator:browser') return;
        // Fluent würde die Titel wieder auf „Mozilla Firefox“ setzen → eigene Titel fest eintragen
        root.removeAttribute('data-l10n-id');
        root.removeAttribute('data-l10n-attrs');
        var t = { 'data-title-default': BRAND, 'data-title-private': BRAND + ' – privat',
          'data-content-title-default': '{content} – ' + BRAND, 'data-content-title-private': '{content} – ' + BRAND + ' – privat',
          'data-title-default-with-profile': BRAND, 'data-content-title-default-with-profile': '{content} – ' + BRAND };
        for (var k in t) root.setAttribute(k, t[k]);
        // neuere Motoren bauen den Titel über getWindowTitleForBrowser – Markenname dort ersetzen
        var gb = win.gBrowser;
        if (gb && gb.getWindowTitleForBrowser && !gb.__immoadvTitle) {
          var orig = gb.getWindowTitleForBrowser.bind(gb);
          gb.getWindowTitleForBrowser = function (b) { return String(orig(b) || BRAND).replace(/(Mozilla )?Firefox( ESR)?/g, BRAND); };
          gb.__immoadvTitle = true;
        }
        if (win.gBrowser && win.gBrowser.updateTitlebar) win.gBrowser.updateTitlebar();
        else win.document.title = BRAND;
        log('Titel: ' + win.document.title + ' / Schutz-Symbol: ' + !!win.document.getElementById('tracking-protection-icon-container'));
      } catch (e) { log('Titel: ' + e); }
    }
    // ---------- Einstellungen: ImmoAdv-Einstellungen statt der Firefox-Seite ----------
    // ≡-Menü „Einstellungen“, Strg+, und about:preferences öffnen die ImmoAdv-Einstellungen.
    // Die Firefox-Seite bleibt für Notfälle erreichbar über about:preferences?firefox
    var SETTINGS = 'moz-extension://6f1a5c1e-3d2b-4e8a-9b7c-1d2e3f4a5b6c/pages/settings.html';
    var MAP = { paneSearch: '#allgemein', panePrivacy: '#datenschutz', 'privacy-logins': '#passwoerter', paneGeneral: '#allgemein', paneHome: '#allgemein' };
    function settings(win) {
      try {
        win.openPreferences = function (pane) {
          var url = SETTINGS + (MAP[pane] || '');
          win.switchToTabHavingURI(url, true, { ignoreFragment: 'whenComparingAndReplace', replaceQueryString: true, triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() });
        };
        win.gBrowser.addTabsProgressListener({
          onLocationChange: function (browser, webProgress, request, location) {
            try {
              if (!webProgress.isTopLevel || location.scheme !== 'about') return;
              var spec = location.spec;
              if (/^about:(preferences|settings)(#.*)?$/.test(spec) && !/\?firefox/.test(spec)) {
                // Erst nach dem laufenden Seitenwechsel umleiten (Fehler 02.11.2026: sofortiges loadURI mitten im Laden von
                // about:preferences ließ eine leere dunkle Seite stehen).
                win.setTimeout(function () { try { browser.loadURI(Services.io.newURI(SETTINGS), { triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() }); } catch (e) { log('Einstellungen: ' + e); } }, 0);
              }
            } catch (e) { /* nie kritisch */ }
          }
        });
      } catch (e) { /* nie kritisch */ }
    }
    // ---------- Symbolleiste wie im ImmoAdv Browser 3: ✦ KI-Assistent als eigener Knopf (beim ersten Fenster anlegen) ----------
    var widgetDone = false;
    function kiButton(win) {
      if (widgetDone) return;
      try {
        var CUI = win.CustomizableUI;
        if (!CUI) { log('KI-Knopf: kein CustomizableUI'); return; }
        widgetDone = true;
        if (CUI.getWidget('immoadv-ki-button') && CUI.getWidget('immoadv-ki-button').provider === CUI.PROVIDER_API) return;
        CUI.createWidget({
          id: 'immoadv-ki-button', type: 'button', defaultArea: CUI.AREA_NAVBAR, removable: true,
          label: 'KI-Assistent', tooltiptext: 'KI-Assistent (Strg+Umschalt+A)',
          onCommand: function (ev) {
            var w = ev.target.ownerGlobal; var sc = w.SidebarController || w.SidebarUI;
            // KI-Seitenleiste öffnen/schließen; geht das nicht (neue Firefox-Seitenleiste), KI als Tab öffnen (Feray 02.11.2026: „KI geht nicht“).
            var ID = 'browser_immoadv_de-sidebar-action';
            try {
              if (sc && sc.isOpen && sc.currentID === ID) sc.hide();
              else if (sc && sc.show) { var p = sc.show(ID); if (p && p.catch) p.catch(function (e) { log('KI Seitenleiste: ' + e); openAi(w); }); }
              else throw new Error('keine Seitenleiste');
            } catch (e) { log('KI öffnen: ' + e); openAi(w); }
          }
        });
        log('KI-Knopf angelegt');
      } catch (e) { log('KI-Knopf: ' + e); }
    }

    function openAi(w) {
      try { w.switchToTabHavingURI('moz-extension://6f1a5c1e-3d2b-4e8a-9b7c-1d2e3f4a5b6c/pages/ai.html', true, { triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() }); } catch (e) { log('KI-Tab: ' + e); }
    }
    // ---------- Brücke für das ImmoAdv-⋯-Menü: Befehle, die nur der Browser selbst ausführen darf ----------
    // Die Erweiterung öffnet moz-extension://…/pages/cmd.html?c=<befehl>; hier wird der Befehl ausgeführt und der Tab sofort geschlossen.
    var CMD = 'moz-extension://6f1a5c1e-3d2b-4e8a-9b7c-1d2e3f4a5b6c/pages/cmd.html?c=';
    function runCmd(win, c) {
      try {
        if (c === 'history') win.PlacesCommandHook.showPlacesOrganizer('History');
        else if (c === 'bookmarks') win.PlacesCommandHook.showPlacesOrganizer('AllBookmarks');
        else if (c === 'downloads') win.PlacesCommandHook.showPlacesOrganizer('Downloads');
        else if (c === 'find') win.gLazyFindCommand('onFindCommand');
        else if (c === 'newwindow') win.OpenBrowserWindow();
        else if (c === 'private') win.OpenBrowserWindow({ private: true });
        else if (c === 'fullscreen') win.BrowserCommands ? win.BrowserCommands.fullScreen() : win.BrowserFullScreen();
        else if (c === 'devtools') win.gDevToolsBrowser ? win.gDevToolsBrowser.toggleToolboxCommand(win.gBrowser) : null;
        else if (c === 'addresses') {
          try { win.openDialog('chrome://formautofill/content/manageAddresses.xhtml', 'immoadv-adressen', 'chrome,centerscreen,resizable,dialog=no'); }
          catch (e) { win.switchToTabHavingURI('about:preferences?firefox#privacy-address-autofill', true, { triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() }); }
        }
        else if (c === 'firefox') win.switchToTabHavingURI('about:preferences?firefox', true, { triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() });
        else if (c === 'addons') win.BrowserAddonUI ? win.BrowserAddonUI.openAddonsMgr() : null;
        else if (c === 'restore') win.SessionStore.restoreLastSession ? win.SessionStore.restoreLastSession() : null;
        else if (c === 'clear') win.Sanitizer ? win.Sanitizer.showUI(win) : null;
        else if (c === 'quit') Services.startup.quit(Ci.nsIAppStartup.eAttemptQuit);
      } catch (e) { /* nie kritisch */ }
    }
    function bridge(win) {
      try {
        win.gBrowser.addTabsProgressListener({
          onLocationChange: function (browser, webProgress, request, location) {
            try {
              if (!webProgress.isTopLevel || location.spec.indexOf(CMD) !== 0) return;
              var c = decodeURIComponent(location.spec.slice(CMD.length).split('&')[0]);
              var tab = win.gBrowser.getTabForBrowser(browser);
              win.setTimeout(function () { try { win.gBrowser.removeTab(tab, { animate: false }); } catch (e) {} runCmd(win, c); }, 0);
            } catch (e) { /* nie kritisch */ }
          }
        });
      } catch (e) { /* nie kritisch */ }
    }
    // ---------- Favicons der Lesezeichen (Feray 02.11.2026: Lesezeichenleiste zeigte nur Weltkugeln) ----------
    // Einmal je Start, im Hintergrund: Lesezeichen ohne Symbol bekommen das Symbol ihrer Website (favicon.ico, ohne Cookies).
    var favDone = false;
    function favicons(win) {
      if (favDone) return; favDone = true;
      win.setTimeout(async function () {
        try {
          var PU = win.PlacesUtils, FS = PU.favicons;
          var tree = await PU.promiseBookmarksTree(PU.bookmarks.toolbarGuid);
          var list = [];
          (function walk(n) { if (n && n.uri && /^https:/.test(n.uri)) list.push(n.uri); ((n && n.children) || []).forEach(walk); })(tree);
          for (var u of list.slice(0, 80)) {
            try {
              var page = Services.io.newURI(u);
              var has = false;
              if (FS.getFaviconForPage) has = !!(await FS.getFaviconForPage(page));
              else has = await new Promise(function (r) { try { FS.getFaviconURLForPage(page, function (x) { r(!!x); }); } catch (e) { r(false); } });
              if (has) continue;
              var ico = page.prePath + '/favicon.ico';
              var res = await win.fetch(ico, { credentials: 'omit', cache: 'force-cache' });
              var type = (res.headers.get('content-type') || 'image/x-icon').split(';')[0];
              if (!res.ok || !/^image\//.test(type)) continue;
              var buf = new Uint8Array(await res.arrayBuffer());
              if (!buf.length || buf.length > 300000) continue;
              var bin = ''; for (var i = 0; i < buf.length; i++) bin += String.fromCharCode(buf[i]);
              await FS.setFaviconForPage(page, Services.io.newURI(ico), Services.io.newURI('data:' + type + ';base64,' + win.btoa(bin)));
            } catch (e) { log('Favicon ' + u + ': ' + e); }
          }
          log('Favicons geprüft: ' + list.length);
        } catch (e) { log('Favicons: ' + e); }
      }, 8000);
    }
    var observer = { observe: function (subject) { log('Fenster bereit'); kiButton(subject); apply(subject); settings(subject); bridge(subject); favicons(subject); } };
    Services.obs.addObserver(observer, 'browser-delayed-startup-finished', false);
    globalThis.__immoadvObserver = observer;   // starke Referenz
  } catch (e) { log('Start: ' + e); }
  log('geladen');
})();
