// ImmoAdv Browser – feste Einstellungen des Firefox-Motors (erste Zeile muss ein Kommentar sein)
// Die ImmoAdv-Erweiterung gehört zum Programm selbst und liegt im eigenen Programmordner – sie braucht keine Mozilla-Signatur.
// (Geht nur mit Firefox ESR; andere Erweiterungen aus dem Mozilla-Katalog bleiben wie gewohnt signiert.)
lockPref("xpinstall.signatures.required", false);
lockPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("extensions.pocket.enabled", false);
lockPref("browser.tabs.firefox-view", false);
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);

// ---------- ImmoAdv statt Firefox im Fenstertitel und in der Taskleiste ----------
// (nur Anzeige; der Motor bleibt unverändert Firefox ESR von Mozilla)
(function () {
  try {
    var BRAND = 'ImmoAdv Browser';
    function apply(win) {
      try {
        var root = win.document && win.document.documentElement;
        if (!root || root.getAttribute('windowtype') !== 'navigator:browser') return;
        // Fluent würde die Titel wieder auf „Mozilla Firefox“ setzen → eigene Titel fest eintragen
        root.removeAttribute('data-l10n-id');
        root.removeAttribute('data-l10n-attrs');
        var t = { 'data-title-default': BRAND, 'data-title-private': BRAND + ' – privat',
          'data-content-title-default': '{content} – ' + BRAND, 'data-content-title-private': '{content} – ' + BRAND + ' – privat',
          'data-title-default-with-profile': BRAND, 'data-content-title-default-with-profile': '{content} – ' + BRAND };
        for (var k in t) root.setAttribute(k, t[k]);
        if (win.gBrowser && win.gBrowser.updateTitlebar) win.gBrowser.updateTitlebar();
        else win.document.title = BRAND;
      } catch (e) { /* Anzeige – nie kritisch */ }
    }
    // ---------- Einstellungen: ImmoAdv-Einstellungen statt der Firefox-Seite ----------
    // ≡-Menü „Einstellungen“, Strg+, und about:preferences öffnen die ImmoAdv-Einstellungen.
    // Die Firefox-Seite bleibt für Notfälle erreichbar über about:preferences?firefox
    var SETTINGS = 'moz-extension://6f1a5c1e-3d2b-4e8a-9b7c-1d2e3f4a5b6c/pages/settings.html';
    var MAP = { paneSearch: '#allgemein', panePrivacy: '#datenschutz', 'privacy-logins': '#passwoerter', paneGeneral: '#allgemein', paneHome: '#allgemein' };
    function settings(win) {
      try {
        win.openPreferences = function (pane) {
          var url = SETTINGS + (MAP[pane] || '');
          win.switchToTabHavingURI(url, true, { ignoreFragment: 'whenComparingAndReplace', replaceQueryString: true, triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() });
        };
        win.gBrowser.addTabsProgressListener({
          onLocationChange: function (browser, webProgress, request, location) {
            try {
              if (!webProgress.isTopLevel || location.scheme !== 'about') return;
              var spec = location.spec;
              if (/^about:(preferences|settings)(#.*)?$/.test(spec) && !/\?firefox/.test(spec)) {
                browser.loadURI(Services.io.newURI(SETTINGS), { triggeringPrincipal: Services.scriptSecurityManager.getSystemPrincipal() });
              }
            } catch (e) { /* nie kritisch */ }
          }
        });
      } catch (e) { /* nie kritisch */ }
    }
    Services.obs.addObserver(function (subject) { apply(subject); settings(subject); }, 'browser-delayed-startup-finished');
  } catch (e) { /* ältere Motoren ohne Services */ }
})();
