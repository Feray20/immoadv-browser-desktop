<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>PDF-Studio</title>
<link rel="stylesheet" href="studio.css"></head>
<body>
<header class="bar">
  <b class="brand">PDF-Studio</b><span id="name" class="name"></span>
  <span class="grow"></span>
  <button id="add" title="Weitere PDFs oder Bilder anhängen">＋ Hinzufügen</button>
  <button id="rotL" title="Ausgewählte Seiten nach links drehen">↺</button>
  <button id="rotR" title="Ausgewählte Seiten nach rechts drehen">↻</button>
  <button id="del" title="Ausgewählte Seiten löschen">Löschen</button>
  <button id="straight" title="Schief eingescannte Seiten automatisch gerade ausrichten">Gerade ausrichten</button>
  <label class="chk"><input type="checkbox" id="ocr" checked> Text erkennen (OCR)</label>
  <button id="save" class="primary">Als PDF speichern</button>
  <input type="file" id="file" accept="application/pdf,image/*" multiple hidden>
</header>
<div id="status" class="status">Lädt …</div>
<main id="grid" class="grid"></main>
<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/tesseract.min.js"></script>
<script type="module" src="studio.mjs"></script>
</body></html>
