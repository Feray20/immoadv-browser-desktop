<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Neuer Tab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="ui.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main class="wrap">
    <header class="brand">
      <img src="icons/icon128.png" alt="" width="44" height="44">
      <div>
        <div class="name">ImmoAdv</div>
        <div id="today" class="muted small"></div>
      </div>
    </header>

    <form id="search" class="search card" action="https://www.google.com/search" method="get" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" name="q" type="search" placeholder="Mit Google suchen oder Adresse eingeben" autocomplete="off" autofocus aria-label="Suche">
    </form>

    <section>
      <h2 class="label">Häufig besucht</h2>
      <div id="tiles" class="tiles"></div>
    </section>

    <section>
      <h2 class="label">ImmoAdv</h2>
      <div class="tiles" id="fixed"></div>
    </section>

    <button id="status" class="status card" type="button" title="Datenschutz-Center öffnen">
      <span id="statusDot" class="dot"></span>
      <span id="statusText">Schutz wird geprüft …</span>
    </button>
  </main>
  <script type="module" src="newtab.js"></script>
</body>
</html>
